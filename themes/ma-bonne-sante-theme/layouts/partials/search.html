{{- $en := eq .Site.Language.Lang "en" -}}
<div class="searchlayer" id="searchlayer" role="dialog" aria-modal="true" aria-label="{{ if $en }}Search{{ else }}Recherche{{ end }}">
    <div class="searchbox">
        <div class="searchbox-field">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--ink-mute)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="search-input" autocomplete="off" placeholder="{{ if $en }}Search an article, a plant, a symptom…{{ else }}Chercher un article, une plante, un symptôme…{{ end }}" aria-label="{{ if $en }}Search{{ else }}Rechercher{{ end }}">
            <span class="searchbox-esc">esc</span>
        </div>
        <div class="searchbox-results" id="search-results"></div>
    </div>
</div>

<script>
(function () {
    var layer = document.getElementById('searchlayer');
    var input = document.getElementById('search-input');
    var out = document.getElementById('search-results');
    var open = document.getElementById('search-open');
    if (!layer || !input || !out) return;

    var INDEX_URL = {{ "index.json" | relLangURL }};
    var EMPTY = {{ cond (eq .Site.Language.Lang "en") "No result." "Aucun résultat." }};
    var HINT = {{ cond (eq .Site.Language.Lang "en") "Type at least two characters." "Tapez au moins deux caractères." }};
    var data = null, loading = false;

    function norm(s) {
        return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }
    function load() {
        if (data || loading) return;
        loading = true;
        fetch(INDEX_URL).then(function (r) { return r.json(); }).then(function (j) {
            data = j; loading = false; render(input.value);
        }).catch(function () { loading = false; });
    }
    function render(q) {
        var nq = norm(q).trim();
        if (nq.length < 2) { out.innerHTML = '<div class="searchbox-empty">' + HINT + '</div>'; return; }
        if (!data) { out.innerHTML = '<div class="searchbox-empty">…</div>'; return; }
        var terms = nq.split(/\s+/);
        var hits = data.filter(function (item) {
            var hay = item.s;
            return terms.every(function (t) { return hay.indexOf(t) !== -1; });
        }).slice(0, 8);
        if (!hits.length) { out.innerHTML = '<div class="searchbox-empty">' + EMPTY + '</div>'; return; }
        out.innerHTML = hits.map(function (h) {
            return '<a href="' + h.u + '">' +
                (h.c ? '<span class="sr-cat">' + h.c + '</span>' : '') +
                '<span class="sr-title">' + h.t + '</span></a>';
        }).join('');
    }
    function show() {
        layer.classList.add('is-open');
        document.body.style.overflow = 'hidden';
        load();
        setTimeout(function () { input.focus(); }, 30);
        render(input.value);
    }
    function hide() {
        layer.classList.remove('is-open');
        document.body.style.overflow = '';
    }

    if (open) open.addEventListener('click', show);
    layer.addEventListener('click', function (e) { if (e.target === layer) hide(); });
    input.addEventListener('input', function () { render(this.value); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && layer.classList.contains('is-open')) hide();
        if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); show(); }
    });
})();
</script>
